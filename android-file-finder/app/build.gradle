plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nrw.filefinder'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nrw.filefinder'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
